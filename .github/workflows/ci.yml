name: Build, Verify and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: crpi-vb458bo8ja2welze.cn-chengdu.personal.cr.aliyuncs.com
  # 镜像路径 <命名空间>/<仓库名>
  IMAGE_NAME: peak2026/lc-dev-env
  # ACR 个人版不支持版本保留策略，改用两个滚动标签把可见版本控制在 2 个
  IMAGE_TAG: latest
  PREVIOUS_TAG: previous

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      repo: ${{ steps.publish.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Build image (load locally for verification)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 门禁：构建产物先通过冒烟测试（工具链 + SSH 登录 + 挂载），通过后才推送
      - name: Smoke test built image
        run: |
          set -euo pipefail
          ./scripts/smoke-test.sh "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" --no-pull

      - name: Login to Alibaba Cloud ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 版本轮转：把当前 latest 改标为 previous（仓库内复制 manifest，不传输镜像层）
      - name: Rotate latest to previous
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${IMAGE_NAME}"
          if docker buildx imagetools inspect "${repo}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "将当前 ${IMAGE_TAG} 标记为 ${PREVIOUS_TAG}"
            docker buildx imagetools create \
              -t "${repo}:${PREVIOUS_TAG}" "${repo}:${IMAGE_TAG}"
          else
            echo "仓库中还没有 ${IMAGE_TAG}，跳过版本轮转"
          fi

      - name: Push image
        id: publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          repo="${REGISTRY}/${IMAGE_NAME}"
          image="${repo}:${IMAGE_TAG}"
          docker push "$image"

          # 读取仓库侧摘要：优先 registry manifest，其次本地 RepoDigests
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [[ "$digest" != sha256:* ]]; then
            rd="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image" 2>/dev/null || true)"
            digest="${rd#*@}"
          fi
          if [[ "$digest" != sha256:* ]]; then
            echo "错误: 无法获取镜像摘要（image=$image）"
            exit 1
          fi

          previous="$(docker buildx imagetools inspect \
            "${repo}:${PREVIOUS_TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

          {
            echo "### 镜像已发布"
            echo
            echo "- 仓库：\`${repo}\`"
            echo "- \`${IMAGE_TAG}\`（当前）：\`${digest}\`"
            if [[ -n "$previous" ]]; then
              echo "- \`${PREVIOUS_TAG}\`（上一版）：\`${previous}\`"
            fi
            echo
            echo "ACR 中只保留 \`${IMAGE_TAG}\` 与 \`${PREVIOUS_TAG}\` 两个版本。"
            echo
            echo "**钉住本次版本运行**：\`IMAGE_DIGEST=${digest} scripts/run.sh\`"
            echo
            echo "**回滚一步**：\`scripts/rollback.sh ${PREVIOUS_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 发布后再从 ACR 按 digest 拉取并复验，确保仓库里的产物本身可用
  verify-published:
    needs: build-and-test
    if: github.event_name != 'pull_request' && needs.build-and-test.outputs.digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Smoke test published image (by digest)
        run: |
          set -euo pipefail
          ./scripts/smoke-test.sh \
            "${{ needs.build-and-test.outputs.repo }}@${{ needs.build-and-test.outputs.digest }}"
