# lc-dev-env 默认配置
#
# 优先级：环境变量 > 本文件 > 脚本内置默认值
# 临时覆盖示例：CONTAINER_NAME=foo scripts/run.sh
#
# 注意：本文件会提交到仓库，不要写入密码等凭据。
# ACR 凭据请通过环境变量提供：ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD

# 镜像仓库与镜像名
REGISTRY="crpi-vb458bo8ja2welze.cn-chengdu.personal.cr.aliyuncs.com"
IMAGE_NAME="peak2026/lc-dev-env"

# 默认 tag：首次安装或 --update 时从这里拉取，随后按 digest 钉住，不会漂移
IMAGE_TAG="latest"

# 容器名：run.sh / enter.sh / rollback.sh / smoke-test.sh 共用
CONTAINER_NAME="lc-dev-env"

# 宿主机代码目录，挂载到容器 /home/git
HOST_GIT_DIR="/home/lc/git"

# 宿主机 SSH 端口 -> 容器 22
SSH_PORT="2228"

# 版本钉住记录目录（自动创建，已在 .gitignore 中忽略）
STATE_DIR="${ROOT_DIR:?}/.state"
